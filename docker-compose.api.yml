# Musubi — API and database only, no web client.
#
# For a server whose users are on the mobile app, or when you bring your own
# front end. The browser client is not in here; for that use docker-compose.yml,
# which puts it and the API on one origin behind a gateway.
#
#   1. Download this file and an env file next to it:
#        base=https://raw.githubusercontent.com/f-tuma/musubi/main
#        curl -O "$base/docker-compose.api.yml"
#        curl -o .env "$base/.env.example"
#   2. Edit .env — at minimum POSTGRES_PASSWORD, BETTER_AUTH_SECRET and
#      BETTER_AUTH_URL. This production stack forces ENVIRONMENT=prod.
#   3. docker compose -f docker-compose.api.yml up -d
#
# Upgrade:   docker compose -f docker-compose.api.yml pull && \
#            docker compose -f docker-compose.api.yml up -d
#
# It pulls the prebuilt API image (no cloning or building), runs an embedded
# Postgres, publishes the API on API_SERVER_PORT, and migrates on startup.
#
# For HTTPS, put a reverse proxy (Caddy, nginx, Traefik…) in front of the
# published port and set BETTER_AUTH_URL to the public https:// origin. The
# mobile app then points at that origin from its welcome screen.
# Deploying with Dokploy instead? Use docker-compose.dokploy.yml.
services:
  api:
    image: frgtndev/musubi:${MUSUBI_TAG:-latest}
    # Building from a local clone instead of the published image? Comment out
    # `image:` above and uncomment this:
    # build:
    #   context: .
    #   dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      ENVIRONMENT: prod
      # Point at the db service on the compose network, overriding .env.
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Used only when S3_BUCKET is unset.
      MEDIA_DIR: /app/data/media
    volumes:
      - media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_SERVER_PORT:-7531}:${API_SERVER_PORT:-7531}"
    # Musubi intentionally supports one API process per database today. The API
    # also enforces this with a PostgreSQL advisory lock at startup.
    deploy:
      replicas: 1
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set your password inside .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  data:
  media:
