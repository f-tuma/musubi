name: Read-only release API diagnostic
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      expected_source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    name: Diagnose GitHub metadata reads only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Read actual metadata using the job token without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          node --input-type=module <<'JS'
          const source=process.env.EXPECTED_SOURCE_SHA;
          if(source!=="6cf27c71a4bd922cc7dbbec9eda069c1a48d4e14") throw new Error("Unexpected diagnostic target");
          const paths=[
           ["absence-main","/git/ref/heads/main"], ["absence-tag","/git/ref/tags/v0.2.12"],
           ["absence-release","/releases/tags/v0.2.12"], ["absence-release-list","/releases?per_page=100&page=1"],
           ["repository",""], ["main","/git/ref/heads/main"], ["quality-workflow","/actions/workflows/quality.yml"],
           ["quality-run-list",`/actions/workflows/318873480/runs?head_sha=${source}&event=push&branch=main&per_page=100&page=1`],
           ["quality-run","/actions/runs/40555107985"], ["quality-jobs","/actions/runs/40555107985/attempts/1/jobs?per_page=100&page=1"],
           ["quality-run-recheck","/actions/runs/40555107985"],
           ["quality-run-list-recheck",`/actions/workflows/318873480/runs?head_sha=${source}&event=push&branch=main&per_page=100&page=1`],
           ["quality-workflow-recheck","/actions/workflows/quality.yml"]
          ];
          for(const [endpoint,path] of paths){
           const result={endpoint,method:"GET"};
           try{
            const r=await fetch("https://api.github.com/repos/f-tuma/musubi"+path,{method:"GET",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+process.env.GH_TOKEN,"X-GitHub-Api-Version":"2022-11-28"},redirect:"error",signal:AbortSignal.timeout(15000)});
            result.status=r.status;result.redirected=r.redirected;
            result.validContentType=/^application\/(?:json|vnd\.github\+json)(?:\s*;|$)/i.test(r.headers.get("content-type")??"");
            result.hasNextPage=/rel="next"/.test(r.headers.get("link")??"");
            result.declaredSizeAcceptable=Number(r.headers.get("content-length")??0)<=2*1024*1024;
            const text=await r.text();result.bodyBytes=Buffer.byteLength(text);
            try{const body=JSON.parse(text);result.jsonValid=true;result.errorClass=["Bad credentials","Resource not accessible by integration","API rate limit exceeded","Not Found"].find(v=>typeof body.message==="string"&&body.message.startsWith(v))??null;}catch{result.jsonValid=false;}
           }catch{result.transportFailed=true;}
           console.log(JSON.stringify(result));
          }
          console.log("READ ONLY diagnostic complete; no proof/tag/release/image operation performed");
          JS
