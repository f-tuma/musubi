name: Publish Docker images

# Manual release. Build each image on native AMD64 and ARM64 runners, then
# publish the version and latest manifests only after all builds succeed.
# The Git tag is created only after both manifests exist and is the sole Dokploy
# deployment signal. The X.Y alias is not published.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 0.1.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  prepare:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release_notes_path: ${{ steps.ver.outputs.release_notes_path }}
    steps:
      - uses: >-
          actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "::error::Releases must run from main"
            exit 1
          }
          V="$RELEASE_VERSION"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must be X.Y.Z (no leading v)"
            exit 1
          }
          node scripts/verify-release.mjs "$V"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$V" \
            >/dev/null 2>&1; then
            echo "::error::v$V already exists and cannot be overwritten"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          notes_path="docs/releases/$V-notes.md"
          if [ -f "$notes_path" ]; then
            echo "release_notes_path=$notes_path" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image.scope }} (${{ matrix.platform.arch }})
    needs: prepare
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: frgtndev/musubi
            dockerfile: apps/api/Dockerfile
            scope: api
          - name: frgtndev/musubi-web
            dockerfile: apps/web/Dockerfile
            scope: web
        platform:
          - name: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - name: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: >-
          actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      # Native runners avoid QEMU's illegal-instruction crash during pnpm deploy.
      - uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: >-
          docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: >-
          docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          outputs: type=image,name=${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.scope }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.image.scope }}-${{ matrix.platform.arch }},mode=max
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${IMAGE_DIGEST#sha256:}"
      - uses: >-
          actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digests-${{ matrix.image.scope }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish ${{ matrix.scope }} manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frgtndev/musubi
            scope: api
          - image: frgtndev/musubi-web
            scope: web
    steps:
      - uses: >-
          actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.scope }}-*
          merge-multiple: true
      - uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: >-
          docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate and publish both architectures
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          digests=("$RUNNER_TEMP/digests/"*)
          [[ ${#digests[@]} -eq 2 ]] || {
            echo "::error::Expected one digest for each architecture"
            exit 1
          }
          sources=()
          for path in "${digests[@]}"; do
            digest="${path##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create --dry-run "${sources[@]}" \
            > "$RUNNER_TEMP/manifest.json"
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "${sources[@]}"

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: >-
          actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: >-
          softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Musubi v${{ needs.prepare.outputs.version }}
          body_path: ${{ needs.prepare.outputs.release_notes_path }}
          generate_release_notes: true
