# Musubi — the whole stack (web client + API + database) behind one origin.
#
# This is the default file: `docker compose up -d` picks it with no -f flag.
#
#   1. Download this file, the gateway config and an env file:
#        curl -O \
#          https://raw.githubusercontent.com/f-tuma/musubi/main/docker-compose.yml
#        curl -o .env \
#          https://raw.githubusercontent.com/f-tuma/musubi/main/.env.example
#        mkdir -p ops/gateway
#        base=https://raw.githubusercontent.com/f-tuma/musubi/main
#        curl -o ops/gateway/Caddyfile "$base/ops/gateway/Caddyfile"
#   2. Edit .env — at minimum POSTGRES_PASSWORD, BETTER_AUTH_SECRET and
#      BETTER_AUTH_URL (your public https:// origin). This production stack
#      forces ENVIRONMENT=prod regardless of the development template.
#   3. Set PUBLIC_HOST to the same hostname so the gateway can get a
#      certificate:
#        PUBLIC_HOST=musubi.example.com
#   4. docker compose up -d
#
# Upgrade: docker compose pull && docker compose up -d
# Rollback: restore a pre-upgrade DB backup with the previous images. Schema
# migrations are forward-only; changing only MUSUBI_TAG is not a safe rollback.
#
# Other shapes of the same stack:
#   docker-compose.api.yml      API + database only, for mobile clients or your
#                               own front end. Supported, not deprecated.
#   docker-compose.dokploy.yml  the full stack on Dokploy, where Traefik is
#                               already the proxy, so this gateway is dropped.
#
# WHY A GATEWAY: the web client and the API must share ONE public origin. That
# is what keeps the session cookie first-party, removes CORS, and lets the
# browser reach /api/* with relative URLs. Splitting them across two hostnames
# is not a supported configuration.
services:
  gateway:
    image: caddy:2-alpine
    environment:
      # Hostname Caddy serves. A real domain gets automatic HTTPS; `:80` serves
      # plain HTTP for a LAN or when another proxy terminates TLS.
      PUBLIC_HOST: ${PUBLIC_HOST:-:80}
      # Runtime hostnames stay stable while Docker replaces container IPs.
      API_UPSTREAM: api:7531
      WEB_UPSTREAM: web:3000
      # Optional landing page on `/`, as host:port reachable from this network.
      # Left alone, `/` opens the app.
      MARKETING_UPSTREAM: ${MARKETING_UPSTREAM:-web:3000}
    volumes:
      - ./ops/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    depends_on:
      - api
      - web
    restart: unless-stopped

  web:
    image: frgtndev/musubi-web:${MUSUBI_TAG:-latest}
    # Building from a local clone instead of the published image? Comment out
    # `image:` above and uncomment this:
    # build:
    #   context: .
    #   dockerfile: apps/web/Dockerfile
    environment:
      PORT: 3000
    # No published port: reachable only through the gateway. It serves the
    # client bundle and never talks to the API itself — the browser does.
    expose:
      - "3000"
    restart: unless-stopped

  api:
    image: frgtndev/musubi:${MUSUBI_TAG:-latest}
    # build:
    #   context: .
    #   dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # Production stacks fail closed even when .env came from the dev template.
      ENVIRONMENT: prod
      # Point at the db service on the compose network, overriding .env.
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Used only when S3_BUCKET is unset.
      MEDIA_DIR: /app/data/media
    volumes:
      - media:/app/data/media
    depends_on:
      db:
        condition: service_healthy
    # Not published either: the gateway routes /api/* here. Keeping it off the
    # host means there is no second origin that could bypass the gateway.
    expose:
      - "${API_SERVER_PORT:-7531}"
    # Musubi intentionally supports one API process per database today: SSE
    # connections live in memory and a startup advisory lock enforces it.
    deploy:
      replicas: 1
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set your password inside .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  data:
  media:
  caddy-data:
  caddy-config:
